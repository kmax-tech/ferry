[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ferry"
version = "0.1.0"
description = "Carry a committed repo to a remote machine, run a command there detached, bring the results back"
requires-python = ">=3.12"
# stdlib only, on purpose: ferry is installed once per person, not per repo,
# and must not drag anything into the environments it carries around.
dependencies = []

# Development only: `pip install -e '.[dev]'`.
[project.optional-dependencies]
# the coding style's three tools: test, lint, type-check (docs/coding-style.md CS-008 Run the linter and the type checker)
dev = ["pytest", "ruff", "pyright"]

[project.scripts]
ferry = "ferry.cli:cli"

[tool.setuptools]
packages = ["ferry"]

[tool.ruff.lint]
# Same pinned scope as labkit and the lab repos (a shifting default is a knob nobody set).
select = ["E4", "E7", "E9", "F", "ANN0", "ANN2", "D100", "D101", "D102", "D103", "D104", "D419", "C901"]

[tool.ruff.lint.per-file-ignores]
# unittest methods: `def test_…(self)` says what it is; `-> None` on each adds nothing
"tests/*" = ["ANN", "D"]

[tool.pyright]
strict = ["ferry"]
# the repo's own venv (`python3 -m venv .venv && .venv/bin/pip install -e '.[dev]'`)
venvPath = "."
venv = ".venv"
